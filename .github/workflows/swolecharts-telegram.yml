name: SwoleCharts Telegram Bot

on:
workflow_dispatch:
schedule:
- cron: "*/5 * * * *"

jobs:
run-bot:
runs-on: ubuntu-latest
timeout-minutes: 5

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Run SwoleCharts bot
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    run: python swolecharts_telegram_bot.py
